# GitHub Pages site for iPlayNow, built from this folder.
# Every guide here is published as a page; README.md is the in-repo index and is
# excluded because index.md is the site's home page.

title: iPlayNow
description: >-
  Free, open-source GeForce NOW player for iPhone and iPad. Native streaming up
  to 4K and 120 fps, controller and virtual controls, gyro aiming, tuned for the
  iPhone Duo. Sideload with AltStore or SideStore.
url: https://reefbarman.github.io
baseurl: /iPlayNow
lang: en
author: reefbarman

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-sitemap

color_scheme: iplaynow
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: Back to top
aux_links:
  GitHub: https://github.com/reefbarman/iPlayNow
  Download: https://github.com/reefbarman/iPlayNow/releases/latest
aux_links_new_tab: true
footer_content: >-
  iPlayNow is open source under AGPL-3.0. Not affiliated with or endorsed by
  NVIDIA. "GeForce NOW" is a trademark of NVIDIA Corporation, and "Xbox" is a
  trademark of Microsoft Corporation.

exclude:
  - README.md

# Sidebar order and search descriptions live here so the guides stay free of
# front matter and read cleanly on GitHub.
defaults:
  - scope:
      path: ""
    values:
      image: /images/app-icon.png
  - scope:
      path: index.md
    values:
      nav_exclude: true
  - scope:
      path: sign-in-and-library.md
    values:
      nav_order: 1
      description: Sign in to GeForce NOW in iPlayNow, browse the games you own as covers, filter by store and give a game its own video settings.
  - scope:
      path: picture.md
    values:
      nav_order: 2
      description: iPlayNow picture settings for GeForce NOW on iPhone and iPad, including resolution, frame rate, bitrate, H.265, HDR, MetalFX upscaling, 120 Hz and frame generation.
  - scope:
      path: controllers.md
    values:
      nav_order: 3
      description: Use an Xbox controller, DualSense or Backbone with iPlayNow, with rumble, gyro aiming, the Home button, the Controls Guide and the Controller Test.
  - scope:
      path: touch-and-virtual-controls.md
    values:
      nav_order: 4
      description: Play GeForce NOW on iPhone without a controller using iPlayNow's on-screen virtual controls, touch as a mouse and the iPhone keyboard.
  - scope:
      path: connection.md
    values:
      nav_order: 5
      description: Get a smooth GeForce NOW stream on iPhone with iPlayNow's Auto bitrate, Check connection and reconnecting after a dropout.
  - scope:
      path: audio.md
    values:
      nav_order: 6
      description: Game audio, microphone and party chat in iPlayNow, the GeForce NOW player for iPhone and iPad.
  - scope:
      path: stream-screen.md
    values:
      nav_order: 7
      description: iPlayNow stream screen shortcuts, the stream menu, typing with the iPhone keyboard, screenshots, battery and heat.
  - scope:
      path: iphone-duo.md
    values:
      nav_order: 8
      description: GeForce NOW on the iPhone Duo with iPlayNow, playing on the inner screen and pausing when folded.
  - scope:
      path: troubleshooting.md
    values:
      nav_order: 9
      description: Fix problems with iPlayNow, share diagnostics, report a bug and see known limitations.
  - scope:
      path: licensing.md
    values:
      nav_order: 10
      description: iPlayNow is free and open source under the AGPL v3. Get the source for any version, see bundled components and their licences.
  - scope:
      path: privacy.md
    values:
      nav_order: 11
      description: iPlayNow's privacy policy. It has no analytics, ads or accounts of its own, and only talks to NVIDIA's GeForce NOW services.
